<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Document body with shadow -->
  <g filter="url(#shadow)">
    <!-- Folded Paper -->
    <path d="M140 100 H300 L372 172 V400 C372 413.25 361.25 424 348 424 H140 C126.75 424 116 413.25 116 400 V124 C116 110.75 126.75 100 140 100 Z" fill="url(#docGrad)"/>
    <!-- Fold corner -->
    <path d="M300 100 V160 C300 166.6 305.4 172 312 172 H372 Z" fill="#e2e8f0"/>
  </g>
  
  <!-- Document content lines -->
  <rect x="156" y="210" width="130" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="156" y="240" width="200" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="156" y="270" width="170" height="14" rx="7" fill="#e2e8f0"/>
  
  <!-- PDF Badge -->
  <rect x="140" y="316" width="136" height="56" rx="14" fill="url(#badgeGrad)"/>
  <text x="208" y="356" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="2">PDF</text>
  
  <!-- Scanner Beam Accent -->
  <line x1="100" y1="280" x2="388" y2="280" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="388" cy="280" r="6" fill="#38bdf8"/>
</svg>
